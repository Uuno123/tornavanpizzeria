<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="format-detection" content="telephone=no">
    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton+SC&display=swap" rel="stylesheet">
    <script src="products.js" defer></script>
    <script src="ostoskori.js"></script>
    <link rel="stylesheet" href="ostoskori.css">
    <title>Törvävänkebabpizzeria - Ostoskori</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
</head>
<body>
      <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="navbar">
        <img src="logo.png" class="logo">
        <div class="nav-holder">
            <div class="nav-left-group">
                <img src="logo.png" class="logo-desktop">
                <div class="nav-holder2">
                    <a href="index.html">Etusivu</a>
                    <a href="menu.html">Menu</a>
                    <a href="index.html">Yhteystiedot</a>
                </div>
            </div>
            <button id="ham" onclick="toggleMenu()" class="hamburger">&#9776;</button>
            <button onclick="window.location.href='ostoskori.html'" class="cart"><span class="cart-badge" id="cartBadge">0</span><svg class="cart-pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></button>
        </div>
    </nav>

    

    <div class="show-nav" id="show-nav">
       <span><a href="index.html">Etusivu</a></span>
       <span><a href="menu.html">Menu</a></span>
       <span><a href="menu.html">Tilaa nyt!</a></span>
       <a class="puh-mob" href="tel:0401829726">040 1829726</a>
    </div>
    <hr class="viiva1">


    <div class="cart-layout">
        <section class="section1">
            <h2 class="hero1">Tilauksesi</h2>
            <hr class="viiva">

            <div class="holder1">
                <div id="cartItems" class="cart-inside"></div>
            </div>

            <div class="upsell-inline" id="upsellInline">
                <h3 class="upsell-inline-title">Unohtuiko jotain?</h3>
                <p class="upsell-inline-sub">Suosittuja lisiä tilaukseesi</p>
                <div class="upsell-grid" id="upsellGrid"></div>
            </div>
        </section>

        <section class="section2">
            <h1 class="hero4">Yhteenveto</h1>
            <hr class="viiva2">

            <div class="summary-card">
                <div class="summary-items" id="summaryItems"></div>
                <div class="summary-footer">
                    <div class="summary-total-row">
                        <span class="total-label">Yhteensä</span>
                        <span class="total-price" id="totalPrice">0.00 €</span>
                    </div>

                    <!-- Asiakkaan tiedot -lomake -->
                    <div class="customer-form">
                        <p class="form-label">Toimitustiedot</p>

                        <div class="delivery-toggle">
                            <button type="button" class="toggle-btn" id="btnDelivery" onclick="setDelivery('delivery')">Toimitus</button>
                            <button type="button" class="toggle-btn active" id="btnPickup" onclick="setDelivery('pickup')">Nouto</button>
                        </div>

                        <div class="form-group">
                            <input type="text" id="customerName" placeholder="Nimi *" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <input type="tel" id="customerPhone" placeholder="Puhelinnumero *" class="form-input" required>
                        </div>
                        <div id="addressGroup" class="form-group">
                            <input type="text" id="customerAddress" placeholder="Toimitusosoite *" class="form-input">
                        </div>
                        <div class="form-group">
                            <textarea id="customerNotes" placeholder="Lisätiedot (vapaaehtoinen)" class="form-input form-textarea" rows="2"></textarea>
                        </div>
                    </div>

                    <button class="order-btn" id="checkoutBtn" onclick="startCheckout()">Siirry maksamaan &rarr;</button>
                    <button class="order-btn order-btn-disabled" id="deliveryUnavailableBtn" disabled style="display:none;">Kotiinkuljetus ei ole toiminnassa</button>

  <!-- Suljettu-modal -->
  <div class="closed-overlay" id="closedOverlay" onclick="closeClosedModal()">
    <div class="closed-modal" onclick="event.stopPropagation()">
      <div class="closed-icon">🕙</div>
      <h2 class="closed-title">Olemme suljettu</h2>
      <p class="closed-text">Otamme tilauksia vastaan aukioloaikoina,<br><strong id="closedTimeText">tuntia ennen sulkeutumista</strong></p>
      <button class="closed-btn" onclick="closeClosedModal()">OK</button>
    </div>
  </div>
                </div>
            </div>
        </section>
    </div>

</body>
</html>
